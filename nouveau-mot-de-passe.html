<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<meta name="robots" content="noindex">
<title>Nouveau mot de passe — Halftik</title>
</head>
<body>
<main style="max-width: 460px">
  <header><a href="./"><img src="icon.png" alt=""><div><h1>Nouveau mot de passe</h1><div class="muted">Compte Halftik</div></div></a></header>

  <form id="form" class="card" hidden>
    <label for="password">Nouveau mot de passe</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8 caractères minimum">
    <label for="confirm">Confirmation</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <button id="submit" type="submit">Enregistrer</button>
    <p id="message" role="status"></p>
  </form>

  <p id="done" class="done" hidden>C'est fait : ton mot de passe a été changé. Retourne dans Halftik et connecte-toi avec ce nouveau mot de passe.</p>
  <p id="invalid" class="card" hidden></p>

  <p class="muted">Un problème ? Écris à <a href="mailto:jordan.thm26@gmail.com">jordan.thm26@gmail.com</a> · <a href="assistance.html">Assistance</a></p>
</main>
<script>
  // Projet Supabase de Halftik. La clé « anon » est publique par conception (la même que dans l'app).
  const SUPABASE_URL = "https://euvbonyqhnnwmkhlasso.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1dmJvbnlxaG5ud21raGxhc3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3ODQ5MjUsImV4cCI6MjExMDM2MDkyNX0.kQdkRwUYllV8V71m_ie7LTszw20RNhW2XJ4gkGgngOU";

  // Le lien de l'email arrive ici avec la session de récupération dans le fragment (#access_token=…&type=recovery).
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("access_token");
  // On retire le jeton de la barre d'adresse (historique, partage de l'URL).
  if (location.hash) history.replaceState(null, "", location.pathname);

  const form = document.getElementById("form");
  const message = document.getElementById("message");
  const invalid = document.getElementById("invalid");

  if (token && params.get("type") === "recovery") {
    form.hidden = false;
    document.getElementById("password").focus();
  } else {
    invalid.textContent = params.get("error_code") === "otp_expired"
      ? "Ce lien a expiré. Dans Halftik, touche à nouveau « Mot de passe oublié ? » pour en recevoir un nouveau."
      : "Ce lien n'est pas valable. Ouvre le dernier email « mot de passe oublié » reçu, ou demande-en un nouveau depuis Halftik.";
    invalid.hidden = false;
  }

  function show(text, error) { message.textContent = text; message.className = error ? "error" : ""; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    if (password.length < 8) return show("Le mot de passe doit faire au moins 8 caractères.", true);
    if (password !== document.getElementById("confirm").value) return show("Les deux mots de passe ne sont pas identiques.", true);
    const button = document.getElementById("submit");
    button.disabled = true;
    show("Enregistrement…", false);
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": ANON_KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      if (res.ok) { form.hidden = true; document.getElementById("done").hidden = false; return; }
      const json = await res.json().catch(() => ({}));
      const code = json.error_code || json.code;
      if (code === "same_password") show("Ce mot de passe est le même que l'ancien, choisis-en un autre.", true);
      else if (code === "weak_password") show("Mot de passe trop faible.", true);
      else if (res.status === 401 || res.status === 403) show("Ce lien a expiré : demande un nouvel email depuis Halftik.", true);
      else show("Erreur (" + res.status + "). Réessaie dans un instant.", true);
    } catch {
      show("Impossible de joindre le serveur. Vérifie ta connexion.", true);
    }
    button.disabled = false;
  });
</script>
</body>
</html>
